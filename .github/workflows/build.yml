name: Build Living Minds

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract project
        run: unzip -q LivingMinds-Forge-1.20.1-starter.zip -d project

      - name: Build mod
        working-directory: project
        run: gradle --no-daemon build

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: LivingMinds-Forge-1.20.1
          path: project/build/libs/*.jar
